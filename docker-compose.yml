services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - AzureAI__Endpoint=${AZURE_AI_ENDPOINT}
      - AzureAI__ApiKey=${AZURE_AI_API_KEY}
      - AzureAI__DefaultModel=${AZURE_AI_DEFAULT_MODEL:-gpt-4o}
      - Dataverse__EnvironmentUrl=${DATAVERSE_ENVIRONMENT_URL}
      - Dataverse__TenantId=${DATAVERSE_TENANT_ID}
      - Dataverse__ClientId=${DATAVERSE_CLIENT_ID}
      - Dataverse__ClientSecret=${DATAVERSE_CLIENT_SECRET}
      - GitHub__Token=${GITHUB_TOKEN:-}
      # Persistence target for solution exports + user-settings.json.
      # Image default DVFORGE_DATA_DIR=/app/data; map to a host volume so
      # artifacts survive container restarts.
    volumes:
      - forge-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://api:5000
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:5000
    depends_on:
      api:
        condition: service_healthy

volumes:
  forge-data:
