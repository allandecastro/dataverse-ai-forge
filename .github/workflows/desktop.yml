name: Desktop (Windows installer)

# Builds the unsigned Windows NSIS installer. Building the win target from a Mac
# would require wine, so this runs natively on windows-latest.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: dataverse-ai-forge-windows
          path: frontend/dist-desktop/*.exe
          if-no-files-found: error
