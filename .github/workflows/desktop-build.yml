name: desktop-build

# Builds the UNSIGNED desktop installers (Windows .exe + macOS .dmg), each on its
# own native runner so the .NET backend is published for the matching RID and the
# electron-builder installer step runs natively (no cross-build / wine).
#
# No code signing: the app is a local single-user tool, and we don't have a
# developer account. Windows will show SmartScreen "unknown publisher"; macOS
# will need a right-click > Open the first time. That's expected for unsigned.
#
# Run it from the Actions tab (workflow_dispatch) or by pushing a v* tag.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build unsigned Windows installer
        working-directory: frontend
        # publish:backend:win (self-contained win-x64) + next build + electron-builder --win
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            frontend/dist-desktop/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build unsigned macOS dmg
        working-directory: frontend
        # publish:backend:mac (self-contained osx-arm64) + next build + electron-builder --mac
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            frontend/dist-desktop/*.dmg
          if-no-files-found: error
