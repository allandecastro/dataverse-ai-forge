name: desktop-build

# Builds the UNSIGNED desktop installers (Windows .exe + macOS .dmg), each on its
# own native runner so the .NET backend is published for the matching RID and the
# electron-builder installer step runs natively (no cross-build / wine), then
# PUBLISHES them to a GitHub Release (electron-builder --publish always).
#
# electron-builder creates the release for the current version (v<package.json
# version>) as a DRAFT and attaches the installers + the latest.yml / latest-mac.yml
# files that electron-updater reads. Review the draft under Releases and click
# Publish to make it downloadable (and to arm auto-update).
#
# No code signing: local single-user tool, no developer account. Windows shows
# SmartScreen "unknown publisher"; macOS needs right-click > Open the first time.
# NOTE: keep package.json "version" in sync with the pushed tag so the release
# name matches the tag.
#
# Run it by pushing a v* tag (recommended) or from the Actions tab.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write # electron-builder needs this to create/upload the GitHub Release

jobs:
  # Create the draft release ONCE, before the two build jobs start. Otherwise each
  # job's electron-builder sees "release doesn't exist" at the same moment, both
  # create one, and the installers end up split across two duplicate drafts
  # (that is what happened to v0.1.4 and v0.1.5). With the draft already in place,
  # electron-builder finds it by tag and only uploads its assets.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure a draft release exists for v<package.json version>
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./frontend/package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$tag" ]; then
            echo "::error::Pushed tag ${GITHUB_REF_NAME} does not match package.json version ($tag)"
            exit 1
          fi
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$tag\") | .id" | wc -l | tr -d ' ')
          if [ "$existing" -gt 0 ]; then
            echo "Release for $tag already exists ($existing) - reusing it."
          else
            gh release create "$tag" --draft --title "${tag#v}" --target "${GITHUB_SHA}" --notes ""
            echo "Created draft release $tag"
          fi

  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build + publish unsigned Windows installer
        working-directory: frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:win

  macos:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build + publish unsigned macOS dmg
        working-directory: frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:mac
