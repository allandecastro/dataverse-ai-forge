name: Dependency vulnerabilities

# Non-blocking — runs alongside CI on push/PR and on a weekly schedule so a
# newly-disclosed CVE in an existing dep gets surfaced even when no code changes.
# Failures here do NOT gate merges; they emit warnings the team can triage.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC — fresh report at the start of the week.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  frontend-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # --audit-level=high so dev-dep low/medium noise doesn't drown the signal.
      # Bump to moderate before going to production.
      - name: npm audit (high+)
        run: npm audit --audit-level=high

  backend-audit:
    name: dotnet vulnerable packages
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DataverseForge.slnx

      # --include-transitive catches CVEs in packages we don't directly reference.
      # Empty output = no vulnerabilities. Non-empty exits 0 anyway; we grep the
      # output to fail the job loud-but-not-blocking.
      - name: List vulnerable packages
        run: |
          OUTPUT=$(dotnet list DataverseForge.slnx package --vulnerable --include-transitive 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qE '(High|Critical)'; then
            echo "::warning::High or critical vulnerable package(s) detected — review and patch"
            exit 1
          fi
